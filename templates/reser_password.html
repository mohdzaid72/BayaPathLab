{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="login-container">
    <div class="login-card">

        <h2>Reset Password</h2>

        <form method="POST" action="/reset-password">

            <input type="hidden"
                   name="token"
                   value="{{ token }}">

            <div class="form-group">
                <input type="password"
                       name="new_password"
                       placeholder="New Password"
                       required>
            </div>

            <button class="login-btn">
                Update Password
            </button>

        </form>

    </div>
</div>

{% endblock %}
