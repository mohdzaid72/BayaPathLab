<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="BayaPathLab is a trusted pathology lab in Kelakhera, Uttarakhand offering CBC, LFT, KFT, Vitamin tests, blood tests, health checkups and home sample collection.">

    <meta name="keywords" content="
    BayaPathLab,
    Pathology Lab Kelakhera,
    Blood Test Kelakhera,
    Diagnostic Centre Uttarakhand,
    Home Sample Collection Kelakhera,
    Health Checkup Uttarakhand,
    CBC Test,
    LFT Test,
    KFT Test
    ">

    <meta name="robots" content="index, follow, max-image-preview:large">

    <meta name="author" content="BayaPathLab">

    <link rel="canonical" href="https://www.bayapathlab.com/">


    <meta property="og:title" content="BayaPathLab - Diagnostic Lab">
    <meta property="og:description" content="Reliable pathology tests and health checkup services.">
    <meta property="og:url" content="https://www.bayapathlab.com/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.bayapathlab.com/static/image/l.png">


    <title>{% block title %}BayaPathLab - Kelakhera, Uttarakhand{% endblock %}</title>

    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/image/loo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/image/loo.png">

    <link rel="apple-touch-icon" href="/static/image/loo.png">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">

    <!-- Markdown + Security -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    

    <script type="application/ld+json">

    {
    "@context":"https://schema.org",
    "@type":"MedicalLaboratory",

    "name":"BayaPathLab",

    "url":"https://www.bayapathlab.com",

    "logo":"https://www.bayapathlab.com/static/image/l.png",

    "description":
    "Trusted pathology laboratory providing blood tests, diagnostic services and health checkups in Kelakhera Uttarakhand.",

    "telephone":"+917500270323",

    "address":
    {
    "@type":"PostalAddress",
    "streetAddress":"Near Thana Kelakhera",
    "addressLocality":"Kelakhera",
    "addressRegion":"Uttarakhand",
    "postalCode":"263150",
    "addressCountry":"IN"
    },

    "geo":
    {
    "@type":"GeoCoordinates",
    "latitude":"29.068",
    "longitude":"79.423"
    },

    "openingHours":
    "Mo-Su 00:00-23:59",

    "priceRange":"₹",

    "areaServed":
    [
    "Kelakhera",
    "Gadarpur",
    "U.S. Nagar",
    "Uttarakhand"
    ]

    }

    </script>
    



</head>

<body>
    {% block content %}{% endblock %}

    <script src="/static/js/script2.js"></script>
</body>
</html>
